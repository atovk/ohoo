<style>:root{color-scheme:light;--ink:#182b2b;--muted:#586d6b;--line:#d5ddda;--paper:#f5f7f4;--surface:#fff;--blue:#254cce;--green:#11704f;--mint:#a3ebc6;--nav:#142d2c;--mono:"IBM Plex Mono","SF Mono",Menlo,monospace;--sans:"DM Sans","Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px}
*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button, a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6586e5;outline-offset:3px}button svg{flex-shrink:0}a{color:var(--blue)}[hidden]{display:none!important}h1,h2,h3,h4,p{margin:0}button{color:inherit}textarea{resize:vertical}
.shell{min-height:100svh;display:grid;grid-template-columns:212px minmax(0,1fr)}

.brand-symbol{display:inline-flex;color:#aaf1c6}.brand-symbol svg{display:block}.space-picker{margin:0 13px 27px;padding:10px 11px;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid #41605b;border-radius:7px;background:#1f3935;color:#f1fbf6;min-height:52px}.space-monogram{width:30px;height:30px;display:grid;place-items:center;border:1px solid #7a9f8b;color:#c9e4cc;border-radius:5px;font-size:15px;font-weight:650}.space-strings{display:grid;gap:2px;flex:1}.space-strings strong{font-size:14px;font-weight:600}.space-strings small{font-size:11px;color:#aec6b8}
.rail-group{margin:0 12px 26px}.rail-group-title{color:#adc5b7;font-size:11px;letter-spacing:.09em;margin:0 10px 9px;display:flex;align-items:center;justify-content:space-between}.rail-add{background:none;border:0;color:inherit;padding:4px;display:grid;place-items:center}.rail-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:6px;padding:10px 12px;text-align:left;background:transparent;color:#ccded5;font-weight:530;min-height:38px;margin:3px 0}.rail-item:hover{background:#203e38}.rail-item.active{background:#2a4942;color:#e6f9ed}.rail-item.active:before{content:"";position:absolute;left:0;width:3px;height:15px;border-radius:3px;background:#a6edbd}.rail-item .count{margin-left:auto;color:#c8e8cf;font:12px var(--mono);background:#314c43;padding:1px 6px;border-radius:4px}.team-marker{display:inline-block;width:11px;height:11px;border:1.5px solid #9dbbb0;border-radius:3px;transform:rotate(-7deg);margin:2px 3px}.active .team-marker{background:#b7e2bb;border-color:#b7e2bb}
.rail-tail{margin-top:auto;padding:12px 12px 17px}.rail-tail hr{border:0;border-top:1px solid #36504a;margin:11px 0}.account{display:flex;gap:10px;align-items:center;padding:4px 7px}.avatar{height:32px;width:32px;display:inline-grid;place-items:center;border-radius:50%;background:#c6dec9;color:#244637;font-weight:680;flex-shrink:0}.account strong{display:block;font-size:13px}.account small{color:#afc9bc;font-size:11px}
.main-col{min-width:0}.topbar{min-height:55px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 29px;display:flex;align-items:center;gap:12px}.crumbs{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}.crumbs span,.crumbs button{font-size:12px}.crumbs button{border:0;background:transparent;padding:4px 0;color:var(--muted)}.crumbs i{color:#a2b0aa;font-style:normal}.crumb-tail{font-weight:650}.prototype-note{margin-left:auto;display:flex;align-items:center;gap:6px;color:#667870;font:11px var(--mono);white-space:nowrap}.prototype-note:before{content:"";width:6px;height:6px;border-radius:50%;background:#749887}.mobile-open{display:none}.menu-overlay{display:none}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:35px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);font-weight:550;text-decoration:none;line-height:1.3}.btn:hover{background:#f1f4f1}.primary,.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#193cae}.ghost,.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:#e9eeea}.muted{color:var(--muted)}.mono{font-family:var(--mono)}.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px}.icon-btn:hover{background:var(--paper)}
.std-page{padding:34px clamp(18px,3.1vw,48px) 42px;max-width:1600px;margin:auto}.std-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.std-head h1{font-size:clamp(28px,3vw,43px);letter-spacing:-.04em;font-weight:620}.std-head p{color:var(--muted);margin-top:8px;line-height:1.6}.std-head .btn{flex-shrink:0}.area-title{font-size:17px;margin:26px 0 12px;font-weight:650}.quick-list{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.quick-row{width:100%;background:transparent;text-align:left;border:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:17px 18px;color:var(--ink)}.quick-row:last-child{border-bottom:0}.quick-row:hover{background:#f5f8f5}.quick-row .push{margin-left:auto}.quick-row strong{display:block;font-size:15px}.quick-row small{display:block;color:var(--muted);margin-top:4px}.sheet-icon{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;background:#e8efea;color:#37534a;border-radius:7px}.blue-icon{background:#e8edfF;color:var(--blue)}.pill{font-size:12px;background:#e1f3e9;display:inline-flex;align-items:center;color:var(--green);padding:3px 7px;line-height:1.35;border-radius:4px}.empty{padding:28px;color:var(--muted);line-height:1.7}.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}.team-preview{border:1px solid var(--line);border-radius:9px;text-align:left;background:white;padding:21px 20px;display:grid;gap:12px;color:var(--ink)}.team-preview:hover{border-color:#8aa899}.team-preview h2{font-size:20px}.team-preview p{color:var(--muted);line-height:1.6}.team-preview .team-meta{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}.section-actions{display:flex;flex-wrap:wrap;gap:8px}
.modal-host{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#10252477;padding:16px}.dialog{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 80px #1229273d;width:min(100%,520px);max-height:92svh;overflow:auto;padding:21px 23px}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px}.dialog-head h2{font-size:21px}.dialog-body{line-height:1.5}.dialog label.form-field{display:grid;gap:5px;margin:11px 0;font-size:13px;font-weight:600}.dialog input:not([type=checkbox]):not([type=radio]),.dialog select,.dialog textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid #bfcbc4;background:white;color:var(--ink);border-radius:5px;font-size:14px}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.dialog .select-space{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:white;padding:12px;text-align:left;width:100%;margin:7px 0}.select-space small{display:block;color:var(--muted)}.checklist{display:flex;flex-wrap:wrap;gap:10px 16px}.checklist label{display:flex;align-items:center;gap:4px}.form-error{color:#9e3b37;margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18332d;color:white;padding:10px 17px;border-radius:8px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 5px 18px #17312c28;pointer-events:none}
@media(max-width:1150px) and (min-width:801px){.shell{grid-template-columns:182px minmax(0,1fr)}.rail-group{margin-left:8px;margin-right:8px}.space-picker{margin-left:9px;margin-right:9px}.topbar{padding-left:20px;padding-right:20px}}
@media(max-width:800px){.shell{display:block}.rail{position:fixed;left:0;top:0;width:225px;transform:translateX(-101%);transition:transform .18s}.nav-open .rail{transform:translateX(0)}.nav-open .menu-overlay{display:block;position:fixed;inset:0;background:#142d2c55;z-index:19;border:0}.mobile-open{display:grid;place-items:center;border:0;background:transparent;padding:4px}.topbar{padding:8px 15px;gap:9px;min-height:47px}.std-page{padding:22px 16px}.std-head{align-items:flex-start;margin-bottom:18px}.std-head p{font-size:13px}.quick-row{padding:14px 11px;gap:9px}.quick-row .pill{display:none}.crumbs{gap:6px}.prototype-note{font-size:10px}.dialog{padding:17px}.toast{bottom:12px}.std-head h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
.run-trail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 12px;flex-wrap:wrap}.run-trail-head .area-title{margin:0}
.spaces-label{color:var(--muted);font-size:12px;font-weight:600}.space-divider{border:0;border-top:1px solid var(--line);margin:18px 0 12px}

.cv-page {--cv-ink:#172c2a;--cv-muted:#52635e;--cv-dim:#61756d;--cv-line:#d2dad3;--cv-blue:#244bd4;--cv-teal:#306455;--cv-paper:#fff;--cv-wash:#f3f5ed;container-type:inline-size;min-width:0;width:100%;color:var(--cv-ink);font-family:'Instrument Sans','PingFang SC','Microsoft YaHei',sans-serif}

.cv-page-head {display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:0 0 23px}

.cv-ver {font-family:'IBM Plex Mono',Menlo,monospace;color:#376352;background:#e7eee3;border:1px solid #cbd8c7;padding:3px 8px;border-radius:5px;font-size:12px;line-height:1.35}
.cv-head-actions,.cv-tools,.cv-switch,.cv-btn,.cv-board-head>div,.cv-board-fact,.cv-legend,.cv-legend>span,.cv-zoom,.cv-form-foot,.cv-form-foot>div {display:flex;align-items:center}
.cv-head-actions {flex-wrap:wrap;gap:8px;padding-top:3px}
.cv-btn {justify-content:center;gap:7px;padding:8px 12px;border:1px solid var(--cv-line);border-radius:7px;background:#fff;color:var(--cv-ink);font-size:13px!important;line-height:1.4;font-weight:580;white-space:nowrap}
.cv-btn:hover:not(:disabled) {background:#f4f7f3;border-color:#9cac9f}

.cv-control {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

.cv-board-head {padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--cv-line);min-height:56px}
.cv-board-head>div {min-width:0;gap:8px}

.cv-board-fact i {width:3px;height:3px;border-radius:50%;background:#85938c}
.cv-tools {background:#f9faf7;gap:6px;flex-wrap:wrap;padding:8px 15px;border-bottom:1px solid var(--cv-line)}
.cv-tools .cv-btn {padding:6px 9px;font-size:12px!important}
.cv-tools .primary {margin-left:auto}
.cv-viewport,.cv-empty {background-color:#f3f5ed;background-image:radial-gradient(#bdc9bd .9px,transparent .9px);background-size:16px 16px}
.cv-viewport {width:100%;padding:0 6px;overflow:auto;max-height:min(690px,82vh);min-height:200px;scrollbar-color:#b8c9b9 transparent}
.cv-sizer {position:relative;margin:0 auto;min-height:100px}
.cv-world {position:relative;transform-origin:0 0}
.cv-lines {position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.cv-wire,.cv-tip {stroke:var(--cv-teal);stroke-width:2.1;fill:none;stroke-linejoin:round;stroke-linecap:round}
.cv-wire.manual {stroke-dasharray:5 5;stroke:#597969}
.cv-edge-hit {fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.cv-lines g:hover .cv-edge-hit {stroke:#3868e12a}

.cv-node {box-sizing:border-box;position:absolute;background:white;color:var(--cv-ink);border:1.6px solid #76968a;border-radius:8px;width:210px;height:100px;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 0 #3b5b4620;isolation:isolate}

.cv-node-head {display:flex;gap:9px;align-items:center;padding:2px 12px 11px;min-width:0}

.cv-node.is-human .cv-node-icon,.cv-focus-icon.person {background:#f6ead3;color:#735d35;border-color:#e1d1b1;border-radius:50%}
.cv-node-foot {display:flex;justify-content:space-between;align-items:center;gap:5px;padding:9px 12px 0;border-top:1px solid #e0e7df}
.cv-engine {font-family:'IBM Plex Mono','PingFang SC',monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#3e584e}
.cv-node.is-selected:not(.is-current) {outline:2px solid #7f9cdd;outline-offset:2px}
.cv-node.is-current {border:2px solid var(--cv-blue);box-shadow:0 3px 0 #2758d41e,0 0 0 3px #244bd416}
.cv-node.is-current .cv-node-icon {background:#e7ecff;border-color:#c4d2fd;color:var(--cv-blue)}
.cv-node.is-current.is-human {border-style:dashed}.cv-node:hover {box-shadow:0 4px 8px #24483428}
.cv-editable .cv-node {cursor:grab;touch-action:none;user-select:none}.cv-editable .cv-node.is-dragging{z-index:5;cursor:grabbing;box-shadow:0 7px 18px #24483430}
.cv-port {position:absolute;z-index:2;width:16px;height:16px;padding:0;border:1px solid #476f5f;border-radius:50%;background:#fff;color:#285643;font-size:11px!important;line-height:1;cursor:crosshair!important;touch-action:none}
.cv-connect-notice {padding:7px 15px;background:#e8edff;color:#233f8f;font-size:12px;display:flex;align-items:center;gap:9px}
.cv-connect-notice button {border:0;background:transparent;color:inherit;text-decoration:underline}
.cv-status {font-size:11px;line-height:1.45;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-weight:550;color:#536359}
.cv-status:before {content:'';width:6px;height:6px;flex:0 0 auto;border-radius:100%;background:#9aa79e}
.cv-status.active {color:#244ac5}.cv-status.active:before {background:#2d54db;box-shadow:0 0 0 2px #d8e3ff}
.cv-status.done,.cv-status.agent {color:#37654d}.cv-status.done:before,.cv-status.agent:before {background:#50795d}.cv-status.human {color:#806232}.cv-status.human:before {border-radius:1px;background:#a18144}
.cv-board-foot {background:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--cv-line);min-height:39px}
.cv-legend {gap:14px;color:var(--cv-muted);font-size:11px;line-height:1.5}.cv-legend>span {gap:5px}.cv-legend i {width:18px;border-top:2px solid var(--cv-teal)}.cv-legend i.dash {border-top-style:dashed}
.cv-zoom {gap:2px;border:1px solid #dce4da;border-radius:5px;overflow:hidden}
.cv-zoom button {border:0;border-radius:0;background:transparent;padding:2px 7px;font-size:12px;color:#3e5348}.cv-zoom button:hover {background:#eef2ec}
.cv-side {padding:16px 15px 14px}.cv-side-title,.cv-block h4 {font-weight:600;font-size:13px;margin:0;color:#52635d;display:flex;justify-content:space-between;gap:5px;align-items:center}
.cv-side-title span,.cv-block h4 small {font-size:11px;color:#67776f;font-weight:500}
.cv-focus {display:flex;align-items:center;gap:10px;margin-top:18px}
.cv-focus-icon {width:39px;height:39px;border-radius:8px}.cv-focus h3 {font-weight:650;font-size:18px;margin:0 0 2px;overflow-wrap:anywhere}
.cv-side p.cv-duty {font-size:13px;line-height:1.6;color:#41544a;margin:13px 0;overflow-wrap:anywhere}
.cv-props {border-top:1px solid #e0e5dc;padding-top:8px;margin:0;font-size:12px;line-height:1.55}
.cv-props>div {display:grid;grid-template-columns:59px 1fr;gap:8px;margin:6px 0}.cv-props dt {color:#647269}.cv-props dd {margin:0;font-weight:520;overflow-wrap:anywhere}
.cv-block {margin-top:15px;border-top:1px solid #e0e5dc;padding-top:12px}
.cv-tags {display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.cv-tags span {background:#eff2ec;border:1px solid #e0e5db;padding:2px 6px;color:#3f5146;border-radius:4px;font-size:11px;overflow-wrap:anywhere;max-width:100%}
.cv-edge-list {margin-top:5px}.cv-edge-row {appearance:none;display:flex;gap:8px;width:100%;padding:7px 0;text-align:left;align-items:flex-start;background:transparent;color:var(--cv-ink);border:0;font-size:12px}
.cv-edge-row span:last-child {min-width:0}.cv-edge-row b,.cv-edge-row small {display:block;overflow-wrap:anywhere}.cv-edge-row b {font-weight:570}.cv-edge-row small {font-size:11px;margin-top:2px;color:var(--cv-muted);line-height:1.5}.cv-arrow {font-family:Menlo,monospace;font-size:15px;color:var(--cv-teal)}.cv-side-action {margin-top:11px;width:100%}
.cv-muted {margin:6px 0 0;font-size:12px;color:var(--cv-muted);line-height:1.6}.cv-small-list {display:none}
.cv-empty {display:grid;justify-items:center;align-content:center;gap:9px;min-height:300px;color:var(--cv-muted);text-align:center;padding:25px}
.cv-empty>span {padding:11px;background:#e3ebe0;color:#517b64;border:1px dashed #9bb29b;border-radius:10px}.cv-empty h3 {color:var(--cv-ink);font-size:18px;margin:0}.cv-empty p{font-size:13px;margin:0 0 4px}
.cv-form,.cv-confirm {color:#20392c}.cv-form {display:grid;gap:12px}
.cv-form label {display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}

    if(!own(n)||s.mode!=='taken'||context(r,n).unavailable||r.status==='已完成')return;
    const latest=s.messages.slice(s.takeStart??s.messages.length).filter(m=>m.who==='user').at(-1)?.text;
    modal('交还给角色 agent',`<form class="sx-form" id="sx-giveback"><label>修改说明与下一步<textarea id="sx-giveback-note" required rows="4" placeholder="写明已改的内容、版本与下一步">${h(latest||'')}</textarea></label><div class="sx-form-foot"><button type="submit" class="btn primary">交还并继续</button></div></form>`,()=>{
      $('#sx-giveback').onsubmit=e=>{
        e.preventDefault();
        const note=$('#sx-giveback-note').value.trim();
        if(!note||!own(n)||s.mode!=='taken'||context(r,n).unavailable)return;
        s.mode='ready';trail(r,n.name+' · 成员交还执行，agent 继续处理');closeModal();
        appendMessage(r,n,s,'交还说明：'+note);
      };
    });
  }
  function nextRev(r,id) {
    return 1 + Math.max(0,...r.artifacts.filter(x=>x.id===id).map(x=>Number(x.rev)||1));
  }
  function currentRevision(r,n) {
    const latest=new Map();
    r.artifacts.filter(v=>v.nodeId===n.id).forEach(v=>latest.set(v.id,v));
    const versions=[...latest.values()].reverse();
    return versions.find(v=>v.status==='已退回')||versions[0]||null;
  }
  function fieldNames(n) {
    return [...new Set((Array.isArray(n.fields)?n.fields:[]).filter(f=>typeof f==='string').map(f=>f.trim()).filter(Boolean))];
  }
  function fieldValue(fields,name) {
    return fields&&Object.hasOwn(fields,name)?String(fields[name]??''):'';
  }
  function fieldDetails(fields) {
    const entries=Object.entries(fields||{});
    return entries.length?`<dl class="sx-art-fields">${entries.map(([key,value])=>`<div><dt>${h(key)}</dt><dd>${h(value)}</dd></div>`).join('')}</dl>`:'';
  }
  function prepare(r,n,previous=null) {
    if(!own(n)||!live(r,n))return;
    const edges=activeEdges(r,n);
    if(!edges.length)return;
    const versions=r.artifacts.filter(v=>v.nodeId===n.id);
    const keys=[...new Set(versions.map(v=>v.id))];
    const base=currentRevision(r,n);
    const names=fieldNames(n);
    const data=previous||{id:base?.id||'',title:base?.title||n.output||'工作产物',content:base?.content||'',fields:base?.fields||{},summary:'',edge:edges[0].id};
    modal('准备交接',`<form id="sx-handoff-form" class="sx-form">
      ${keys.length?`<label>修订对象<select id="sx-id"><option value="">新产物</option>${keys.map(id=>`<option value="${a(id)}"${data.id===id?' selected':''}>${h(versions.filter(v=>v.id===id).at(-1).title)}</option>`).join('')}</select></label>`:''}
      <label>产物名称<input id="sx-atitle" required maxlength="100" value="${a(data.title)}"></label>
      <label>提交的内容或文件链接<textarea id="sx-content" required rows="4" placeholder="只填写准备交付的内容">${h(data.content)}</textarea></label>
      ${names.map((name,i)=>`<label>${h(name)}<textarea id="sx-extra-${i}" required rows="2">${h(fieldValue(data.fields,name))}</textarea></label>`).join('')}
      <label>交接摘要<textarea id="sx-summary" required rows="2" placeholder="下一位需要知道什么？">${h(data.summary)}</textarea></label>
      <label>接收角色与规则<select id="sx-edge">${edges.map(e=>`<option value="${a(e.id)}"${data.edge===e.id?' selected':''}>${h(nodeName(r,e.to))} · ${h(e.result||'提交')} · ${e.mode==='auto'?'自动':'手动'}</option>`).join('')}</select></label>
      <div class="sx-form-foot"><span>原会话与登录凭据保留在本人环境。</span><button type="submit" class="btn primary">预览交接 →</button></div></form>`,()=>{
      const select=$('#sx-id');
      if(select)select.onchange=()=>{
        const v=versions.filter(v=>v.id===select.value).at(-1);
        $('#sx-atitle').value=v?.title||n.output||'工作产物';$('#sx-content').value=v?.content||'';
        names.forEach((key,i)=>{$('#sx-extra-'+i).value=fieldValue(v?.fields,key);});
      };
      $('#sx-handoff-form').onsubmit=e=>{
        e.preventDefault();
        const d={id:select?.value||'',title:$('#sx-atitle').value.trim(),content:$('#sx-content').value.trim(),
          fields:Object.fromEntries(names.map((key,i)=>[key,$('#sx-extra-'+i).value.trim()])),
          summary:$('#sx-summary').value.trim(),edge:$('#sx-edge').value};
        const missing=names.findIndex(key=>!d.fields[key]);
        if(missing!==-1){notice('请填写'+names[missing]);$('#sx-extra-'+missing).focus();return;}
        if(!d.title||!d.content||!d.summary){notice('请填写产物内容和交接摘要');return;}
        preview(r,n,d);
      };
    });
  }
  function preview(r,n,d) {
    const edge=activeEdges(r,n).find(e=>e.id===d.edge);if(!edge)return;
    const auto=edge.mode==='auto';
    const draft={...d,id:d.id||uid(),to:edge.to};
    const rev=nextRev(r,draft.id);
    modal('交接预览',`<div class="sx-preview"><div class="sx-route">${h(n.name)} <b>→</b> ${h(nodeName(r,edge.to))}</div>
      <small>满足「${h(edge.result||'提交')}」 · ${auto?'自动':'手动'}转交 · 产物 v${rev}</small><h3>${h(d.title)}</h3><p class="sx-document">${h(d.content)}</p>${fieldDetails(d.fields)}
      <small>交接摘要</small><p>${h(d.summary)}</p><div class="sx-privacy">下游只收到以上产物和摘要，私有对话、执行日志与凭据不会转交。</div>
      <div class="sx-form-foot">${btn('sx-previous','返回修改')}${btn('sx-confirm',auto?'提交并自动转交 →':'保存待交稿','btn primary')}</div></div>`,()=>{
      $('#sx-previous').onclick=()=>prepare(r,n,d);
      $('#sx-confirm').onclick=()=>{
        if(!own(n)||!live(r,n))return;
        if(auto)deliver(r,n,draft,'自动');
        else {
          getSession(r,n).staged=draft;
          trail(r,`${n.name} · 已保存待交稿，等待手动转交`);
          closeModal();persistView();notice('待交稿已保存，可在本次交接中手动转交');
        }
      };
    });
  }
  function deliver(r,n,d,mode) {
    if(!own(n)||!live(r,n)||!activeEdges(r,n).some(e=>e.id===d.edge&&e.to===d.to)) {notice('当前节点或交接规则已变化');return;}
    if(fieldNames(n).some(name=>!fieldValue(d.fields,name).trim())){
      prepare(r,n,d);notice('请补全本角色的产物字段');return;
    }
    const rev=nextRev(r,d.id);
    const record={id:d.id,title:d.title,rev,nodeId:n.id,toId:d.to,summary:d.summary,content:d.content,fields:{...d.fields},status:'待签收',createdBy:state.user};
    r.artifacts.push(record);getSession(r,n).staged=null;r.current=d.to;
    trail(r,`${n.name} → ${nodeName(r,d.to)} · ${mode}转交《${d.title}》v${rev}`);
    closeModal();persistView();notice('已转交给'+nodeName(r,d.to));
  }
  function inspect(r,n,v) {
    if(!visibleArtifacts(r,n).includes(v))return;
    const canReview=own(n)&&live(r,n)&&v.toId===n.id&&v.status==='待签收';
    const ending=canReview&&!activeEdges(r,n).length&&!r.artifacts.some(x=>x!==v&&x.status==='待签收');
    modal(v.title,`<div class="sx-preview"><div class="sx-route">${h(nodeName(r,v.nodeId))} <b>→</b> ${h(nodeName(r,v.toId))}</div>
      <small>v${h(v.rev)} · ${h(v.status)} · 提交人 ${h(v.createdBy)}</small><p class="sx-document">${h(v.content)}</p>${fieldDetails(v.fields)}
      <small>交接摘要</small><p>${h(v.summary)}</p>${v.feedback?`<small>退回意见</small><p>${h(v.feedback)}</p>`:''}
      ${ending?`<div class="sx-privacy"><strong>团队完成条件</strong><br>${h(r.finish||'终点负责人签收当前版本。')}</div>`:''}
      ${canReview?`<label class="sx-feedback-label">退回时填写意见<textarea id="sx-feedback" rows="2" placeholder="需要修改哪一处？"></textarea></label>
      <div class="sx-form-foot">${btn('sx-reject','退回修订')}${btn('sx-accept',ending?'确认条件已满足，签收并结束':'签收此版本','btn primary')}</div>`:
      !own(n)||n.id!==v.toId?`<div class="sx-form-foot">${btn('sx-open-receiver','查看接收节点 →')}</div>`:''}</div>`,()=>{
      const open=$('#sx-open-receiver');if(open)open.onclick=()=>{closeModal();openSession(v.toId);};
      if(!canReview)return;
      $('#sx-reject').onclick=()=>{
        const reason=$('#sx-feedback').value.trim();
        if(!reason){notice('请写明退回原因');$('#sx-feedback').focus();return;}
        if(!own(n)||!live(r,n)||v.status!=='待签收')return;
        v.status='已退回';v.feedback=reason;r.current=v.nodeId;
        trail(r,`${n.name} 退回《${v.title}》v${v.rev} · ${reason}`);
        closeModal();persistView();notice('已退回'+nodeName(r,v.nodeId));
      };
      $('#sx-accept').onclick=()=>{
        if(!own(n)||!live(r,n)||v.status!=='待签收')return;
        v.status='已签收';
        trail(r,`${n.name} 签收《${v.title}》v${v.rev}`);
        if(!activeEdges(r,n).length&&!r.artifacts.some(x=>x.status==='待签收')){
          r.status='已完成';trail(r,'终点签收完成，运行已结束');
        }
        closeModal();persistView();notice(r.status==='已完成'?'已签收，运行完成':'已签收此版本');
      };
    });
  }
  function bindSession() {
    const {r,n}=selected();
    const back=$('#sx-back');if(back)back.onclick=()=>go('canvas');
    if(!r||!n||!$('.sx[data-sx-run]'))return;
    all('[data-sx-art]').forEach(b=>b.onclick=()=>{
      const v=visibleArtifacts(r,n).find(v=>v.id===b.dataset.aid&&String(v.rev)===b.dataset.rev);if(v)inspect(r,n,v);
    });
    if(!own(n))return;
    const s=getSession(r,n);
    if(s.pending) schedule(r,n,s);
    const scroll=$('#sx-messages');if(scroll)scroll.scrollTop=scroll.scrollHeight;
    const field=$('#sx-input');
    if(field){
      field.oninput=()=>{s.draft=field.value;save();};
      field.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();$('#sx-compose').requestSubmit();}};
      $('#sx-compose').onsubmit=e=>{e.preventDefault();if(!field.disabled)appendMessage(r,n,s,field.value);};
    }
    const file=$('#sx-file');if(file)file.onchange=async()=>{
      const f=file.files?.[0];if(!f)return;
      try {
        const textLike=/^text\//.test(f.type)||/\.(txt|md|csv|json|log|yaml|yml)$/i.test(f.name);
        const sample=textLike?await f.slice(0,24000).text():'';
        const material='文件：'+f.name+(sample?'\n'+sample+(f.size>24000?'\n（仅摘录前 24 KB）':''):'\n（仅记录文件名，未读取正文）');
        s.draft=[s.draft,material].filter(Boolean).join('\n');save();field.value=s.draft;field.focus();
      }catch{notice('无法读取文件，可直接粘贴可分享的摘录');}
    };
    for(const [id,mode] of [['sx-stop','stopped'],['sx-take','taken'],['sx-return','ready']]){
      const b=$('#'+id);if(b)b.onclick=()=>mode==='ready'?returnToAgent(r,n,s):changeMode(r,n,s,mode);
    }
    const sub=$('#sx-submit');if(sub)sub.onclick=()=>prepare(r,n);
    const hand=$('#sx-transfer');if(hand)hand.onclick=()=>{if(s.staged)deliver(r,n,s.staged,'手动');};
    const discard=$('#sx-discard');if(discard)discard.onclick=()=>{s.staged=null;persistView();notice('已撤回待交稿');};
  }
  window.renderSession=renderSession;
  window.bindSession=bindSession;
})();

const adminSelection = new Map();

function adminActiveEnv() {
  const list = envs().filter(env => env.owner === state.user);
  return list.find(env => env.id === adminSelection.get(workspace().id)) || list[0];
}

function adminIsRemote(env) {
  return env.kind ? env.kind === 'remote' : String(env.id).startsWith('remote-');
}

function adminAllowed(env) {
  return env && (!adminIsRemote(env) || workspace().allowRemote);
}

function adminStatus(value) {
  const color = ({ '在线': 'live', '已验证': 'live', '已发现': 'found', '需登录': 'warn' })[value] || 'quiet';
  return `<span class="adm-status adm-${color}"><i aria-hidden="true"></i>${esc(value)}</span>`;
}

function adminTime(value) {
  if (!value) return '本次尚未检测';
  return new Date(value).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit',hour:'2-digit',minute:'2-digit', hour12:false});
}

function adminDeviceName(env) {
  return adminIsRemote(env) ? '远端主机' : '工作机';
}

function adminRenderTools(env) {
  const online = env.status === '在线' && adminAllowed(env);
  const providers = env.providers || [];
  const lines = providers.map((provider, i) => {
    const canTest = online && provider.status !== '需登录';
    let action = provider.status === '需登录' ? '模拟登录后试跑' : provider.status === '已验证' ? '再次试跑' : '试跑验证';
    return `<div class="adm-tool-row">
      <span class="adm-tool-name"><span class="adm-cli-mark" aria-hidden="true">${icon('terminal',16)}</span>${esc(provider.name)}</span>
      ${adminStatus(provider.status)}
      <button type="button" class="adm-inline" data-adm-test="${i}" ${online ? '' : 'disabled'} title="${canTest ? '运行模拟试跑' : '查看模拟登录与试跑步骤'}">${action}</button>
    </div>`;
  }).join('');
  return `<section class="adm-tools">
    <div class="adm-tools-head"><div><h3>执行器目录</h3><p>${online ? '最近检测' : '缓存记录'} · ${adminTime(env.lastScan)}</p></div>
    <button class="btn ghost" type="button" id="adm-scan" ${online ? '' : 'disabled'}>${providers.length ? '重新检测' : '检测执行器'}</button></div>
    ${providers.length ? `<div class="adm-tool-row adm-table-head"><span>执行器 / CLI</span><span>检测结果</span><span>验证</span></div>${lines}` : '<div class="adm-no-tools">尚无执行器记录。连接设备后，点击「检测执行器」查看模拟发现结果。</div>'}
  </section>`;
}

function renderEnv() {
  const current = workspace();
  const own = envs().filter(env => env.owner === state.user);
  const others = envs().filter(env => env.owner !== state.user);
  const active = adminActiveEnv();
  const buttons = own.map(env => `<button type="button" data-adm-env="${esc(env.id)}" class="adm-device-choice ${env.id === active.id ? 'selected' : ''}" aria-pressed="${env.id === active.id}">
      <b>${esc(env.name)}</b><span>${adminDeviceName(env)} · ${esc(env.status)}</span></button>`).join('');
  const detail = active ? `<div class="adm-device-detail">
      <header class="adm-device-heading"><div class="adm-device-overline">${adminDeviceName(active)} <span>/</span> ${esc(state.user)}</div>
      <div class="adm-title-line"><h2>${esc(active.name)}</h2>${adminStatus(active.status)}</div>
      <p>执行身份与此设备的所有者绑定。以下检测与试跑为原型模拟。</p></header>
      ${!adminAllowed(active) ? '<div class="adm-note">当前工作区已暂停远端执行。管理员可在「工作区设置」调整此策略。</div>' : active.status !== '在线' ? '<div class="adm-note">设备已离线。下方保留上次检测结果，重新连接后可继续试跑。</div>' : ''}
      ${adminRenderTools(active)}
      <div class="adm-detail-foot"><span>设备连接</span><button class="btn ghost" type="button" id="adm-connection" ${adminAllowed(active) ? '' : 'disabled'}>${active.status === '在线' ? '模拟离线' : '模拟重连'}</button></div>
    </div>` : '<div class="adm-device-detail adm-empty"><h2>连接你的第一台设备</h2><p>先配对工作机，之后可在这台设备上验证执行器。</p><button type="button" class="btn primary" data-adm-pair>连接设备</button></div>';
  return `<div class="adm-page">
    <header class="adm-page-head"><div><h1>执行环境</h1><p>管理你在${esc(current.name)}登记的执行设备与可用 CLI。</p></div><button class="btn primary" type="button" data-adm-pair>${icon('plus',16)} 连接设备</button></header>
    <div class="adm-device-grid"><aside class="adm-device-list"><h3>我的设备 <span>${String(own.length).padStart(2, '0')}</span></h3>${buttons || '<p class="adm-list-empty">暂无设备</p>'}</aside>${detail}</div>
    ${others.length ? `<section class="adm-others"><header><h3>其他成员的设备</h3><p>仅显示工作区内的登记信息，设备由本人管理。</p></header>${others.map(env => `<div class="adm-other-row"><b>${esc(env.name)}</b><span>${esc(env.owner)}</span>${adminStatus(env.status)}</div>`).join('')}</section>` : ''}
  </div>`;
}

function adminUpdate(message) {
  save();
  render();
  if (message) notice(message);
}

function adminPair() {
  const tenantId = workspace().id;
  const allowRemote = workspace().allowRemote;
  const localName = state.user + '的工作机';
  const pairCode = String(Math.floor(100000 + Math.random() * 900000));
  modal('连接执行设备', `<form id="adm-pair-form" class="adm-dialog">
    <p class="adm-dialog-intro">为${esc(state.user)}配对属于当前工作区的设备。此流程使用演示配对码。</p>
    <label>设备类型<select name="kind"><option value="local">本机工作环境</option><option value="remote" ${allowRemote ? '' : 'disabled'}>${allowRemote ? '远端主机 · 个人账号' : '远端主机 · 工作区未开放'}</option></select></label>
    <label>设备名称<input required maxlength="60" name="name" value="${esc(localName)}" autocomplete="off"></label>
    <div class="adm-pair-code"><span>演示配对码</span><b>${pairCode.slice(0,3)} ${pairCode.slice(3)}</b></div>
    <p class="adm-dialog-hint">配对码仅用于这次模拟，浏览器不会访问执行机。</p>
    <div class="adm-dialog-actions"><button type="button" class="btn ghost" data-adm-cancel>取消</button><button class="btn primary" type="submit">完成模拟配对</button></div>
    </form>`, () => {
    const form = document.getElementById('adm-pair-form');
    form.querySelector('[data-adm-cancel]').onclick = closeModal;
    form.elements.kind.onchange = () => {
      if ([localName, state.user + '的远端主机'].includes(form.elements.name.value)) {
        form.elements.name.value = state.user + (form.elements.kind.value === 'remote' ? '的远端主机' : '的工作机');
      }
    };
    form.onsubmit = event => {
      event.preventDefault();
      const name = form.elements.name.value.trim();
      const kind = form.elements.kind.value;
      if (!name) { form.elements.name.focus(); return; }
      if (workspace().id !== tenantId || (kind === 'remote' && !workspace().allowRemote)) { closeModal(); render(); return; }
      if (envs().some(env => env.owner === state.user && env.name === name)) {
        notice('已有同名设备，请使用不同名称。');
        form.elements.name.focus();
        return;
      }
      const device = {id:uid('env'), name, kind, owner:state.user, status:'在线',providers:[]};
      envs().push(device);
      adminSelection.set(tenantId,device.id);
      closeModal();
      adminUpdate('模拟配对完成，可在新设备上检测执行器。');
    };
  });
}

function adminScan(device) {
  if (device.owner !== state.user || device.status !== '在线' || !adminAllowed(device)) return;
  if (!device.providers) device.providers = [];
  const fixtures = [['Codex','已发现'],['Claude Code','需登录'],['pi','已发现']];
  fixtures.forEach(([name,status]) => {
    if (!device.providers.some(p => p.name.toLowerCase() === name.toLowerCase())) device.providers.push({name,status});
  });
  device.lastScan = new Date().toISOString();
  adminUpdate('模拟发现完成，已刷新本设备的执行器目录。');
}

function adminTest(device, index) {
  const tenantId = workspace().id;
  const provider = device.providers[index];
  if (!provider || device.owner !== state.user || device.status !== '在线' || !adminAllowed(device)) return;
  const login = provider.status === '需登录';
  const verb = login ? '模拟登录并试跑' : '开始模拟试跑';
  modal('验证执行器', `<div class="adm-dialog"><p class="adm-dialog-intro">在${esc(device.name)}上验证 ${esc(provider.name)}，执行身份为${esc(device.owner)}。</p>
    ${login ? '<div class="adm-note">模拟检测返回「需登录」。真实环境中应由本人在执行机登录，再次试跑。</div>' : ''}
    <div class="adm-sample"><span>试跑样例</span><p>返回当前工作目录的名称。</p></div>
    <p class="adm-dialog-hint">此处只演示验证流程，不会启动 CLI 或读取个人凭据。</p>
    <div class="adm-dialog-actions"><button class="btn ghost" data-adm-cancel type="button">取消</button><button class="btn primary" type="button" id="adm-test-now">${verb}</button></div></div>`, () => {
      document.querySelector('[data-adm-cancel]').onclick = closeModal;
      document.getElementById('adm-test-now').onclick = () => {
        const current = envs().find(env => env.id === device.id);
        if (workspace().id !== tenantId || !current || current.owner !== state.user || current.status !== '在线' || !adminAllowed(current)) { closeModal(); render(); return; }
        provider.status = '已验证';
        provider.lastTest = new Date().toISOString();
        closeModal();
        adminUpdate(`${provider.name} 模拟试跑成功，结果已记入当前设备。`);
      };
  });
}

function bindEnv() {
  document.querySelectorAll('[data-adm-pair]').forEach(button => button.onclick = adminPair);
  document.querySelectorAll('[data-adm-env]').forEach(button => button.onclick = () => {
    adminSelection.set(workspace().id,button.dataset.admEnv);
    render();
  });
  const device = adminActiveEnv();
  if (!device) return;
  const scan = document.getElementById('adm-scan');
  if (scan) scan.onclick = () => adminScan(device);
  document.querySelectorAll('[data-adm-test]').forEach(button => button.onclick = () => adminTest(device,Number(button.dataset.admTest)));
  const connection = document.getElementById('adm-connection');
  if (connection) connection.onclick = () => {
    if (device.owner !== state.user || !adminAllowed(device)) return;
    device.status = device.status === '在线' ? '离线' : '在线';
    adminUpdate(device.status === '在线' ? '设备已模拟重连，请按需刷新目录。' : '已模拟离线，保留此设备的检测记录。');
  };
}

function bindSettings() {
  const form = document.getElementById('adm-settings-form');
  if (!form) return;
  const id = workspace().id;
  form.onsubmit = event => {
    event.preventDefault();
    const w = workspace();
    if (w.id !== id) return;
    const name = form.elements.workspaceName.value.trim();
    if (!name) { form.elements.workspaceName.focus(); return; }
    const address = form.elements.address;
    const url = address ? address.value.trim() : '';
    if (address && url && !/^https?:\/\//i.test(url)) {
      notice('企业服务地址需以 https:// 或 http:// 开头。');
      address.focus();
      return;
    }
    w.name = name;
    if (address) w.serviceAddress = url;
    w.allowRemote = form.elements.remote.checked;
    if (!w.allowRemote) envs().filter(adminIsRemote).forEach(env => env.status = '离线');
    adminUpdate('当前工作区的设置已保存。');
  };
}

const main = document.getElementById('main-content');
const dialogHost = document.getElementById('modal-host');
let lastFocus=null, toastTimer;
function notice(msg){
 const t=document.getElementById('toast'); t.textContent=msg;t.hidden=false;
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3000);
}
function closeModal(){dialogHost.hidden=true;dialogHost.innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();lastFocus=null;}
function modal(title,html,onMount){
 if(dialogHost.hidden)lastFocus=document.activeElement;
 dialogHost.hidden=false;
 dialogHost.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button type="button" class="icon-btn" id="dialog-close" aria-label="关闭对话框">${icon('x',16)}</button></header><div class="dialog-body">${html}</div></section>`;
 dialogHost.querySelector('#dialog-close').onclick=closeModal;
 onMount?.(dialogHost);
 const input=dialogHost.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,select');
 (input||dialogHost.querySelector('button'))?.focus();
}
dialogHost.addEventListener('click',e=>{if(e.target===dialogHost)closeModal()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!dialogHost.hidden)closeModal();else {document.body.classList.remove('nav-open');syncNav();}}
 if(e.key==='Tab'&&!dialogHost.hidden){
  const tabbables=[...dialogHost.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href]')].filter(el=>el.offsetParent);
  if(!tabbables.length)return;
  if(e.shiftKey&&document.activeElement===tabbables[0]){e.preventDefault();tabbables.at(-1).focus();}
  else if(!e.shiftKey&&document.activeElement===tabbables.at(-1)){e.preventDefault();tabbables[0].focus();}
 }
});
const goLabels={home:'工作台',teams:'团队',canvas:'团队画布',session:'角色会话',runs:'运行记录',inbox:'待我处理',env:'执行环境',settings:'工作区设置'};
function go(view){
 state.view=view;document.body.classList.remove('nav-open');syncNav();render();window.scrollTo({top:0,behavior:'instant'});
}
function selectTeam(id,rid){
 const t=workspace().teams.find(x=>x.id===id);if(!t)return;
 state.selectedTeam=t.id;state.selectedRun=rid||t.runs[0]?.id||null;
 state.selectedNode=run()?.current||t.nodes[0]?.id||null;
 state.canvasMode=run()?'run':'edit';
 go('canvas');
}
function openSession(nodeId){
 const current=run();if(!current){startRunDialog();return;}
 if(!current.nodes.some(n=>n.id===nodeId)){notice('该角色未包含在本次运行的流程版本中');return;}
 state.selectedNode=nodeId;go('session');
}
function startRunDialog(){
 const t=team();if(!t){go('teams');return;}
 if(!t.published?.nodes?.length){notice('先在画布配置角色并发布流程');state.canvasMode='edit';go('canvas');return;}
 modal('发起一次工作',`<form id="run-form"><p class="muted">${esc(t.name)} · 已发布流程 v${t.published.version}</p><label class="form-field">本次委托<input name="title" required maxlength="80" placeholder="例如：为订单列表增加 CSV 导出"></label><p class="muted">完成条件 · ${esc(t.published.finish||t.finish)}</p><div class="actions"><button class="btn" type="button" data-cancel>取消</button><button class="btn primary" type="submit">${icon('play',15)} 发起工作</button></div></form>`,host=>{
  const form=host.querySelector('form');form.querySelector('[data-cancel]').onclick=closeModal;
  form.onsubmit=e=>{e.preventDefault();const title=form.elements.title.value.trim();if(!title)return;const r=makeRun(t,'RUN-'+uid().slice(3,9).toUpperCase(),title);t.runs.unshift(r);state.selectedRun=r.id;state.selectedNode=r.current;state.canvasMode='run';closeModal();go('canvas');notice('已按 v'+r.version+' 发起工作');};
 });
}
function createTeamDialog(){
 const w=workspace();
 modal('创建团队',`<form id="new-team"><label class="form-field">团队名称<input name="teamName" required maxlength="24" placeholder="例如：文稿评审组"></label><label class="form-field">目标<input name="goal" required maxlength="100" placeholder="这个团队长期负责什么？"></label><label class="form-field">完成条件<input name="finish" required maxlength="100" placeholder="例如：主编签收当前版本的定稿"></label><label class="form-field">起点<select name="template"><option value="blank">空白画布</option><option value="editorial">撰稿与编辑模板</option></select></label><div class="form-field"><strong>团队成员</strong><div class="checklist">${w.members.map(u=>`<label><input type="checkbox" name="member" value="${esc(u)}" ${u===state.user?'checked disabled':''}>${esc(u)}</label>`).join('')}</div></div><div class="form-error" aria-live="polite"></div><div class="actions"><button type="button" class="btn" data-cancel>取消</button><button class="btn primary" type="submit">创建并进入画布</button></div></form>`,host=>{
  const form=host.querySelector('form');form.querySelector('[data-cancel]').onclick=closeModal;
  form.onsubmit=e=>{e.preventDefault();const f=form.elements,name=f.teamName.value.trim(),goal=f.goal.value.trim(),finish=f.finish.value.trim();
   if(!name||!goal||!finish||w.teams.some(t=>t.name===name)){form.querySelector('.form-error').textContent='请填写完整，并使用当前工作区中未使用的团队名称。';return;}
   const t=makeTeam(uid(),name,goal,finish,f.template.value);t.dirty=true;t.members=[...form.querySelectorAll('[name=member]:checked')].map(i=>i.value);
   t.nodes.forEach(n=>{if(n.kind==='agent'){n.envId='';n.provider='';}});w.teams.push(t);closeModal();selectTeam(t.id);notice('团队已创建，流程为草稿');
  };
 });
}
function createWorkspaceDialog(){
 const same=workspace(),deployment=same.deployment;
 modal('创建工作区',`<form id="new-space-form"><label class="form-field">工作区名称<input required name="spaceName" maxlength="30" placeholder="例如：设计协作组"></label><p class="muted">${deployment==='self'?'当前企业实例':'SaaS 托管'} · 初始管理员 ${esc(state.user)}</p><div class="form-error"></div><div class="actions"><button type="button" class="btn" id="back-to-spaces">返回</button><button class="btn primary" type="submit">创建工作区</button></div></form>`,host=>{
  host.querySelector('#back-to-spaces').onclick=switchSpaceDialog;
  host.querySelector('form').onsubmit=e=>{e.preventDefault();const name=e.target.elements.spaceName.value.trim();
   if(!name||state.spaces.some(w=>w.deployment===deployment&&w.name===name)){host.querySelector('.form-error').textContent='请填写当前部署内未使用的工作区名称。';return;}
   const w={id:uid(),name,members:[state.user],deployment,allowRemote:same.allowRemote,serviceAddress:same.serviceAddress||'',teams:[],envs:[]};
   state.spaces.push(w);state.selectedWorkspace=w.id;state.selectedTeam=null;state.selectedRun=null;state.selectedNode=null;state.canvasMode='edit';closeModal();go('home');notice('工作区已创建');
  };
 });
}
function switchSpaceDialog(){
 const current=workspace();
 function row(w){return `<button class="select-space" type="button" data-space="${esc(w.id)}"><span><strong>${esc(w.name)}</strong><small>${w.deployment==='self'?'企业自部署':'SaaS 云工作区'} · ${w.teams.length} 个团队</small></span>${icon(w.id===state.selectedWorkspace?'check':'arrow-right',16)}</button>`;}
 const same=state.spaces.filter(w=>w.deployment===current.deployment),other=state.spaces.filter(w=>w.deployment!==current.deployment);
 const html=`<div class="spaces-label">当前部署</div>${same.map(row).join('')}<button class="btn" type="button" id="new-workspace">${icon('plus',15)} 创建工作区</button>${other.length?`<hr class="space-divider"><div class="spaces-label">切换部署示例 · 仅在本地原型中可用</div>${other.map(row).join('')}`:''}`;
 modal('选择工作区',html,host=>{
  host.querySelector('#new-workspace').onclick=createWorkspaceDialog;
  host.querySelectorAll('[data-space]').forEach(b=>b.onclick=()=>{const id=b.dataset.space;
   if(id===state.selectedWorkspace){closeModal();return;}
   state.selectedWorkspace=id;const t=workspace().teams[0];state.selectedTeam=t?.id||null;state.selectedRun=t?.runs[0]?.id||null;state.selectedNode=t?.nodes[0]?.id||null;state.canvasMode=run()?'run':'edit';closeModal();go('home');notice('已切换到'+workspace().name);
  });
 });
}
function pending(){
 const out=[];
 for(const t of workspace().teams)for(const r of t.runs){
  if(r.status==='已完成')continue;
  const n=r.nodes.find(n=>n.id===r.current);if(!n||n.owner!==state.user)continue;
  const a=r.artifacts.findLast(a=>a.toId===n.id&&a.status==='待签收');
  if(n.kind==='human'||a)out.push({team:t,run:r,node:n,artifact:a});
 }
 return out;
}
function enterJob(tid,rid,nid){selectTeam(tid,rid);if(nid)openSession(nid);}
function rail(){

  <button class="space-picker" id="switch-space"><span class="space-monogram">${esc(w.name[0])}</span><span class="space-strings"><strong>${esc(w.name)}</strong><small>${w.deployment==='self'?'企业自部署':'SaaS 工作区'}</small></span>${icon('chevron-down',15)}</button>
  <div class="rail-group"><div class="rail-group-title">工作区</div>${entry('home','工作台','grid')+entry('teams','团队','workflow')+entry('inbox','待我处理','inbox',`<span class="count">${pending().length}</span>`)+entry('env','执行环境','monitor')}</div>
  <div class="rail-group"><div class="rail-group-title">我的团队<button class="rail-add" id="rail-add-team" aria-label="创建团队">${icon('plus',14)}</button></div>${w.teams.map(t=>`<button class="rail-item ${['canvas','runs','session'].includes(v)&&t.id===state.selectedTeam?'active':''}" data-team="${esc(t.id)}"><span class="team-marker"></span><span>${esc(t.name)}</span></button>`).join('')}</div>

function breadcrumb(){
 const w=workspace(),v=state.view;
 const bits=[`<button data-go="home">${esc(w.name)}</button>`];
 if(['canvas','session','runs'].includes(v)&&team()){
  bits.push('<button data-go="teams">团队</button>',`<button data-go="canvas">${esc(team().name)}</button>`);

const actionBtn=(attr,label,ic='plus')=>`<button class="btn primary" ${attr}>${icon(ic,16)}${label}</button>`;
function teamCards(){

function homePage(){

function runsPage(){
 const t=team(),r=run();if(!t)return teamsPage();

 modal(a.title+' · v'+a.rev,`<p class="muted">${esc(a.createdBy)} · ${esc(a.status)}</p><h3 class="area-title">交接摘要</h3><p>${esc(a.summary||'无')}</p><h3 class="area-title">已提交的内容</h3><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.content||'未附正文')}</div>${Object.entries(a.fields||{}).map(([key,value])=>`<h3 class="area-title">${esc(key)}</h3><p>${esc(value)}</p>`).join('')}`);

function render(){
 save();
 document.getElementById('rail').innerHTML=rail();document.getElementById('crumbs').innerHTML=breadcrumb();

 const map={home:homePage,teams:teamsPage,canvas:renderCanvas,runs:runsPage,session:renderSession,inbox:inboxPage,env:renderEnv,settings:renderSettings};
 main.innerHTML=(map[v]||homePage)();
 ({canvas:bindCanvas,session:bindSession,env:bindEnv,settings:bindSettings})[v]?.();
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
